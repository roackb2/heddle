name: Publish packages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-packages.yml
      - docs/releases/execution-host-client-v*.md
      - docs/releases/postgres-v*.md
      - docs/releases/run-client-v*.md
      - docs/releases/runtime-v*.md
      - package.json
      - packages/execution-host-client/**
      - packages/postgres/**
      - packages/run-client/**
      - packages/runtime/**
      - scripts/execution-host-client-release-state.mjs
      - scripts/execution-host-client-pack-result.mjs
      - scripts/finalize-execution-host-client-release.mjs
      - scripts/verify-execution-host-client-package.mjs
      - scripts/verify-execution-host-client-pack.mjs
      - scripts/finalize-postgres-release.mjs
      - scripts/postgres-release-state.mjs
      - scripts/verify-postgres-package.mjs
      - scripts/verify-postgres-pack.mjs
      - scripts/run-client-release-state.mjs
      - scripts/runtime-release-state.mjs
      - scripts/verify-run-client-package.mjs
      - scripts/verify-run-client-pack.mjs
      - scripts/verify-runtime-package.mjs
      - scripts/verify-runtime-pack.mjs
      - yarn.lock
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  runtime:
    name: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin release tooling
        run: npm install --global npm@12.0.2 yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and verify runtime
        run: yarn runtime:pack:verify

      - name: Select release state
        id: release
        run: yarn runtime:release:state

      - name: Create immutable release tag
        if: steps.release.outputs.publication_needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
            test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${RELEASE_TAG}" -m "Heddle Runtime v${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish package when missing
        if: steps.release.outputs.publication_needed == 'true'
        run: >-
          npm publish ./packages/runtime
          --provenance
          --access public
          --tag latest

      - name: Verify registry release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(npm view "@heddleagent/runtime@${RELEASE_VERSION}" version)" = "${RELEASE_VERSION}"
          test "$(npm view @heddleagent/runtime dist-tags.latest)" = "${RELEASE_VERSION}"

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" --json targetCommitish --jq .targetCommitish)" = "${GITHUB_SHA}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "@heddleagent/runtime ${RELEASE_VERSION}" \
              --notes-file "docs/releases/runtime-v${RELEASE_VERSION}.md"
          fi

  run-client:
    name: run-client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin release tooling
        run: npm install --global npm@12.0.2 yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and verify run client
        run: yarn run-client:pack:verify

      - name: Select release state
        id: release
        run: yarn run-client:release:state

      - name: Create immutable release tag
        if: steps.release.outputs.publication_needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
            test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${RELEASE_TAG}" -m "Heddle Run Client v${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish package when missing
        if: steps.release.outputs.publication_needed == 'true'
        run: >-
          npm publish ./packages/run-client
          --provenance
          --access public
          --tag latest

      - name: Verify registry release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(npm view "@heddleagent/run-client@${RELEASE_VERSION}" version)" = "${RELEASE_VERSION}"
          test "$(npm view @heddleagent/run-client dist-tags.latest)" = "${RELEASE_VERSION}"

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" --json targetCommitish --jq .targetCommitish)" = "${GITHUB_SHA}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "@heddleagent/run-client ${RELEASE_VERSION}" \
              --notes-file "docs/releases/run-client-v${RELEASE_VERSION}.md"
          fi

  execution-host-client:
    name: execution-host-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/execution-host-client/conformance/reference-adopters/python-v1/pyproject.toml

      - name: Pin release tooling
        run: npm install --global npm@12.0.2 yarn@1.22.22

      - name: Verify release tooling
        run: |
          node --version
          npm --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify package family
        run: yarn package-family:verify

      - name: Test Execution Host client
        run: yarn execution-host-client:test

      - name: Install Python conformance reference
        run: python -m pip install -e 'packages/execution-host-client/conformance/reference-adopters/python-v1[test]'

      - name: Verify Python conformance reference
        run: |
          python -m ruff check packages/execution-host-client/conformance/reference-adopters/python-v1
          python -m ruff format --check packages/execution-host-client/conformance/reference-adopters/python-v1
          python -m pytest packages/execution-host-client/conformance/reference-adopters/python-v1

      - name: Build Execution Host client
        run: yarn execution-host-client:build

      - name: Select release state
        id: release
        run: node scripts/execution-host-client-release-state.mjs

      - name: Verify release artifact
        run: node scripts/verify-execution-host-client-pack.mjs

      - name: Create immutable release tag
        if: steps.release.outputs.publication_needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
            test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${RELEASE_TAG}" -m "Execution Host Client v${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish or verify immutable npm artifact
        run: node scripts/verify-execution-host-client-pack.mjs --publish-if-missing

      - name: Create or verify GitHub release
        if: steps.release.outputs.release_selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/finalize-execution-host-client-release.mjs

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heddle
          POSTGRES_PASSWORD: heddle
          POSTGRES_DB: heddle_package
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heddle -d heddle_package"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      HEDDLE_POSTGRES_TEST_URL: postgresql://heddle:heddle@127.0.0.1:5432/heddle_package

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin release tooling
        run: npm install --global npm@12.0.2 yarn@1.22.22

      - name: Verify release tooling
        run: |
          node --version
          npm --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify package family
        run: yarn package-family:verify

      - name: Apply PostgreSQL lifecycle migration
        run: >-
          psql "$HEDDLE_POSTGRES_TEST_URL"
          --set ON_ERROR_STOP=1
          --file packages/postgres/migrations/execution-host/conversations/0000_turn_lifecycle.sql

      - name: Test PostgreSQL package
        run: yarn postgres:test

      - name: Build PostgreSQL package
        run: yarn postgres:build

      - name: Select release state
        id: release
        run: node scripts/postgres-release-state.mjs

      - name: Verify release artifact
        run: node scripts/verify-postgres-pack.mjs

      - name: Create immutable release tag
        if: steps.release.outputs.publication_needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
            test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${RELEASE_TAG}" -m "Heddle PostgreSQL Adapters v${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish or verify immutable npm artifact
        run: node scripts/verify-postgres-pack.mjs --publish-if-missing

      - name: Create or verify GitHub release
        if: steps.release.outputs.release_selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/finalize-postgres-release.mjs
